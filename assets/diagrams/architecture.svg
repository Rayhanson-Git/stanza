<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d">
  <title id="t">Stanza architecture map</title>
  <desc id="d">The players feed NowPlayingMonitor; LyricEngine keeps the song clock and asks LyricsProvider (disk cache, NetEase, LRCLIB) for timed lyrics; each frame LyricStage builds a StyleContext for one of 23 styles, drawn in the overlay windows, the gallery window and the render tools. Below, the app shell: AppDelegate, AppSettings, LyricPlacement, ArtworkColorSync, AppUpdater and LoginItem.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif; fill: #EADCC8; }
    .h1 { font-size: 26px; font-weight: 700; }
    .sub { font-size: 14px; fill: #7FB3B8; }
    .lane { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; fill: #7FB3B8; }
    .bt { font-size: 15px; font-weight: 700; }
    .bl { font-size: 12.5px; fill: #C9BBA8; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; fill: #C9BBA8; }
    .al { font-size: 11.5px; fill: #7FB3B8; font-style: italic; }
    .hot { fill: #F2A7A6; }
    .chip { font-size: 12.5px; font-weight: 600; }
    .leg { font-size: 12.5px; fill: #C9BBA8; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FB3B8"/>
    </marker>
    <marker id="arrHot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C2302F"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10202B"/>
      <stop offset="1" stop-color="#0A0F14"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="720" rx="24" fill="url(#bg)"/>

  <text x="40" y="54" class="h1">How the parts of Stanza fit together</text>
  <text x="40" y="78" class="sub">From a song playing in a player to words on the lock screen. The crimson path runs once per display frame.</text>

  <!-- lane labels -->
  <text x="40" y="112" class="lane">PLAYERS</text>
  <text x="230" y="112" class="lane">READING</text>
  <text x="480" y="112" class="lane">LYRICS AND TIME</text>
  <text x="750" y="112" class="lane">DRAWING</text>
  <text x="1000" y="112" class="lane">ON SCREEN</text>

  <!-- players -->
  <rect x="40" y="128" width="150" height="56" rx="14" fill="#0A0F14" stroke="#2E6F73" stroke-width="1.5"/>
  <text x="115" y="161" class="bt" text-anchor="middle">Apple Music</text>
  <rect x="40" y="196" width="150" height="56" rx="14" fill="#0A0F14" stroke="#2E6F73" stroke-width="1.5"/>
  <text x="115" y="229" class="bt" text-anchor="middle">Spotify</text>

  <!-- monitor -->
  <rect x="230" y="128" width="210" height="112" rx="14" fill="#10202B" stroke="#2E6F73" stroke-width="1.5"/>
  <text x="246" y="154" class="bt">NowPlayingMonitor</text>
  <text x="246" y="176" class="bl">PlayerProbe, AppleScript</text>
  <text x="246" y="194" class="bl">every 0.5 s, 2 s timeout</text>
  <text x="246" y="212" class="bl">keeps an anchor: a position</text>
  <text x="246" y="229" class="bl">at a moment, and a rate</text>

  <rect x="230" y="262" width="210" height="72" rx="14" fill="#10202B" stroke="#2E6F73" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="246" y="288" class="bt">PlayerLink</text>
  <text x="246" y="309" class="bl">permission steps, polled</text>
  <text x="246" y="325" class="bl">every 2 s only while shown</text>

  <path d="M190,156 L228,170" stroke="#7FB3B8" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <path d="M190,224 L228,206" stroke="#7FB3B8" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <path d="M230,296 C200,296 170,280 150,256" stroke="#7FB3B8" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)"/>
  <text x="120" y="300" class="al">Automation</text>
  <text x="120" y="315" class="al">checks</text>

  <!-- engine -->
  <rect x="480" y="128" width="230" height="112" rx="14" fill="#10202B" stroke="#2E6F73" stroke-width="1.5"/>
  <text x="496" y="154" class="bt">LyricEngine</text>
  <text x="496" y="176" class="bl">the song clock, every frame:</text>
  <text x="496" y="196" class="mono">anchor + 0.18 s lead</text>
  <text x="496" y="214" class="mono">+ offset − nudge</text>
  <text x="496" y="231" class="bl">offset ≤ 1 s, nudge ≤ 20 s</text>

  <path d="M440,184 L478,184" stroke="#7FB3B8" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <text x="444" y="176" class="al">track</text>

  <!-- provider -->
  <rect x="480" y="262" width="230" height="196" rx="14" fill="#10202B" stroke="#2E6F73" stroke-width="1.5"/>
  <text x="496" y="288" class="bt">LyricsProvider</text>
  <text x="608" y="288" class="bl">(an actor)</text>
  <rect x="496" y="302" width="198" height="40" rx="10" fill="#0A0F14" stroke="#2E6F73"/>
  <text x="510" y="327" class="chip">1 · Disk cache v2</text>
  <rect x="496" y="352" width="198" height="40" rx="10" fill="#0A0F14" stroke="#2E6F73"/>
  <text x="510" y="377" class="chip">2 · NetEase: word timing</text>
  <rect x="496" y="402" width="198" height="40" rx="10" fill="#0A0F14" stroke="#2E6F73"/>
  <text x="510" y="427" class="chip">3 · LRCLIB: fallback</text>
  <path d="M560,241 L560,260" stroke="#7FB3B8" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <path d="M640,261 L640,242" stroke="#7FB3B8" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <text x="566" y="255" class="al">ask</text>
  <text x="646" y="255" class="al">TimedLyrics</text>
  <text x="496" y="478" class="al">HTTPS, no cookies; title, artist and length must agree</text>

  <!-- stage -->
  <rect x="750" y="128" width="210" height="112" rx="14" fill="#10202B" stroke="#C2302F" stroke-width="1.8"/>
  <text x="766" y="154" class="bt">LyricStage</text>
  <text x="766" y="176" class="bl">builds a StyleContext: line,</text>
  <text x="766" y="194" class="bl">position, clock, band, palette</text>
  <text x="766" y="214" class="mono">scale = Size×footprint</text>
  <text x="766" y="231" class="bl">then sway and Drag offset</text>

  <path d="M710,170 L748,170" stroke="#C2302F" stroke-width="2.2" fill="none" marker-end="url(#arrHot)"/>
  <text x="712" y="162" class="al hot">position</text>

  <!-- styles -->
  <rect x="750" y="262" width="210" height="196" rx="14" fill="#10202B" stroke="#C2302F" stroke-width="1.8"/>
  <text x="766" y="288" class="bt">23 styles</text>
  <text x="766" y="308" class="bl">each a pure function of</text>
  <text x="766" y="325" class="bl">its context: no view state</text>
  <rect x="766" y="338" width="178" height="30" rx="15" fill="#2E6F73"/>
  <text x="855" y="358" class="chip" text-anchor="middle">Kinetic type · 8</text>
  <rect x="766" y="374" width="178" height="30" rx="15" fill="#2E6F73"/>
  <text x="855" y="394" class="chip" text-anchor="middle">Motion scenes · 9</text>
  <rect x="766" y="410" width="178" height="30" rx="15" fill="#2E6F73"/>
  <text x="855" y="430" class="chip" text-anchor="middle">Phone screens · 6</text>
  <path d="M855,240 L855,260" stroke="#C2302F" stroke-width="2.2" fill="none" marker-end="url(#arrHot)"/>

  <!-- outputs -->
  <rect x="1000" y="128" width="178" height="112" rx="14" fill="#0A0F14" stroke="#EADCC8" stroke-width="1.5"/>
  <text x="1016" y="154" class="bt">Overlay</text>
  <text x="1016" y="176" class="bl">one window per display,</text>
  <text x="1016" y="194" class="bl">click-through, in a</text>
  <text x="1016" y="212" class="bl">lock-screen space at</text>
  <text x="1016" y="229" class="bl">level 400</text>

  <rect x="1000" y="262" width="178" height="94" rx="14" fill="#0A0F14" stroke="#EADCC8" stroke-width="1.5"/>
  <text x="1016" y="288" class="bt">Gallery window</text>
  <text x="1016" y="310" class="bl">hero, shelf, panels;</text>
  <text x="1016" y="328" class="bl">the same LyricStage</text>
  <text x="1016" y="345" class="bl">with a demo or live song</text>

  <rect x="1000" y="376" width="178" height="82" rx="14" fill="#0A0F14" stroke="#EADCC8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1016" y="402" class="bt">--render tools</text>
  <text x="1016" y="424" class="bl">the pictures in this</text>
  <text x="1016" y="441" class="bl">repository</text>

  <path d="M960,330 C980,330 978,184 998,184" stroke="#C2302F" stroke-width="2.2" fill="none" marker-end="url(#arrHot)"/>
  <path d="M960,345 L998,320" stroke="#C2302F" stroke-width="2.2" fill="none" marker-end="url(#arrHot)"/>
  <path d="M960,400 L998,414" stroke="#C2302F" stroke-width="2.2" fill="none" marker-end="url(#arrHot)"/>
  <text x="966" y="476" class="al hot">one frame</text>

  <!-- app shell -->
  <rect x="24" y="504" width="1152" height="148" rx="18" fill="none" stroke="#2E6F73" stroke-width="1.2" stroke-dasharray="2 5"/>
  <text x="40" y="530" class="lane">APP SHELL · STARTED BY APPDELEGATE AT LAUNCH</text>

  <rect x="40" y="546" width="174" height="92" rx="14" fill="#10202B" stroke="#2E6F73" stroke-width="1.5"/>
  <text x="54" y="572" class="bt">AppDelegate</text>
  <text x="54" y="593" class="bl">menu bar, one copy</text>
  <text x="54" y="610" class="bl">only, 10 s pause fade</text>

  <rect x="228" y="546" width="174" height="92" rx="14" fill="#10202B" stroke="#2E6F73" stroke-width="1.5"/>
  <text x="242" y="572" class="bt">AppSettings</text>
  <text x="242" y="593" class="bl">UserDefaults; style,</text>
  <text x="242" y="610" class="bl">Size, font, colours,</text>
  <text x="242" y="627" class="bl">Favourites</text>

  <rect x="416" y="546" width="174" height="92" rx="14" fill="#10202B" stroke="#2E6F73" stroke-width="1.5"/>
  <text x="430" y="572" class="bt">LyricPlacement</text>
  <text x="430" y="593" class="bl">the Drag Position pill;</text>
  <text x="430" y="610" class="bl">slides the overlay</text>
  <text x="430" y="627" class="bl">windows while dragged</text>

  <rect x="604" y="546" width="174" height="92" rx="14" fill="#10202B" stroke="#2E6F73" stroke-width="1.5"/>
  <text x="618" y="572" class="bt">ArtworkColorSync</text>
  <text x="618" y="593" class="bl">album-cover accent and</text>
  <text x="618" y="610" class="bl">palette, only when used</text>

  <rect x="792" y="546" width="174" height="92" rx="14" fill="#10202B" stroke="#2E6F73" stroke-width="1.5"/>
  <text x="806" y="572" class="bt">AppUpdater</text>
  <text x="806" y="593" class="bl">Sparkle; daily check of</text>
  <text x="806" y="610" class="bl">the GitHub appcast,</text>
  <text x="806" y="627" class="bl">EdDSA-verified</text>

  <rect x="980" y="546" width="180" height="92" rx="14" fill="#10202B" stroke="#2E6F73" stroke-width="1.5"/>
  <text x="994" y="572" class="bt">LoginItem</text>
  <text x="994" y="593" class="bl">SMAppService, offered</text>
  <text x="994" y="610" class="bl">only from Applications</text>

  <!-- legend -->
  <line x1="40" y1="686" x2="76" y2="686" stroke="#C2302F" stroke-width="2.2" marker-end="url(#arrHot)"/>
  <text x="86" y="690" class="leg">per-frame path</text>
  <line x1="210" y1="686" x2="246" y2="686" stroke="#7FB3B8" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="256" y="690" class="leg">data, on change</text>
  <line x1="390" y1="686" x2="426" y2="686" stroke="#7FB3B8" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="436" y="690" class="leg">control or on demand</text>
  <text x="1160" y="690" class="leg" text-anchor="end">Sources/ · 65 Swift files</text>
</svg>
