<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" width="1200" height="980" role="img" aria-labelledby="t d">
  <title id="t">Stanza motion system</title>
  <desc id="d">Three studies. One: the player pill widens on hover and grows into its card on a click, every part on one spring with response 0.5 and damping 0.82, the panel content 0.1 s behind. Two: a settings panel rolls up out of its button, scaling from 0.3 on a spring with response 0.3 and damping 0.84. Three: lyrics dim to 55 percent after 5 s of quiet and wake 2 s before the next line, and the whole overlay fades out 5 s into a pause.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif; fill: #EADCC8; }
    .h1 { font-size: 26px; font-weight: 700; }
    .sub { font-size: 14px; fill: #7FB3B8; }
    .h2 { font-size: 18px; font-weight: 700; }
    .st { font-size: 13.5px; font-weight: 700; }
    .sd { font-size: 12.5px; fill: #C9BBA8; }
    .al { font-size: 12px; fill: #7FB3B8; font-style: italic; }
    .ax { font-size: 11px; fill: #8FA3A8; }
    .ui { font-size: 11px; font-weight: 600; }
    .hot { fill: #F2A7A6; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; fill: #EADCC8; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10202B"/>
      <stop offset="1" stop-color="#0A0F14"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FB3B8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="980" rx="24" fill="url(#bg)"/>
  <text x="40" y="54" class="h1">How Stanza moves</text>
  <text x="40" y="78" class="sub">Springs for things you touch, slow eases for things that happen to you. Every number comes from the code; the overshoot is worked out from it.</text>

  <!-- ===== 1. player pill ===== -->
  <text x="40" y="128" class="h2">1 · The player pill grows into its card</text>

  <!-- rest -->
  <rect x="90" y="180" width="44" height="80" rx="22" fill="#1C2A33" stroke="#7FB3B8" stroke-width="1.3"/>
  <rect x="102" y="190" width="20" height="20" rx="5" fill="#3A1218" stroke="#E5484D"/>
  <circle cx="112" cy="240" r="10" fill="#1DB954"/>
  <circle cx="124" cy="211" r="3" fill="#8A9096"/><circle cx="124" cy="251" r="3" fill="#8A9096"/>
  <text x="112" y="290" class="st" text-anchor="middle">Rest</text>
  <text x="112" y="308" class="sd" text-anchor="middle">44 × 80, corners 22</text>

  <!-- labelled -->
  <rect x="262" y="180" width="150" height="80" rx="22" fill="#1C2A33" stroke="#7FB3B8" stroke-width="1.3"/>
  <rect x="274" y="190" width="20" height="20" rx="5" fill="#3A1218" stroke="#E5484D"/>
  <circle cx="284" cy="240" r="10" fill="#1DB954"/>
  <text x="304" y="205" class="ui">Apple Music</text>
  <text x="304" y="244" class="ui">Spotify</text>
  <text x="337" y="290" class="st" text-anchor="middle">Pointed at</text>
  <text x="337" y="308" class="sd" text-anchor="middle">widens to the left, names fade in</text>

  <path d="M140,200 L256,200" stroke="#7FB3B8" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <text x="198" y="192" class="al" text-anchor="middle">pointer enters</text>
  <path d="M256,244 L140,244" stroke="#7FB3B8" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <text x="198" y="262" class="al" text-anchor="middle">leaves</text>

  <!-- card -->
  <rect x="520" y="150" width="250" height="250" rx="26" fill="#1C2A33" stroke="#7FB3B8" stroke-width="1.3"/>
  <rect x="534" y="164" width="22" height="22" rx="6" fill="#3A1218" stroke="#E5484D"/>
  <circle cx="579" cy="175" r="11" fill="#1DB954"/>
  <text x="536" y="214" class="st">Apple Music</text>
  <rect x="534" y="228" width="222" height="154" rx="12" fill="none" stroke="#C2302F" stroke-width="1.3" stroke-dasharray="5 4"/>
  <rect x="546" y="244" width="150" height="7" rx="3.5" fill="#7FB3B8" fill-opacity="0.35"/>
  <rect x="546" y="262" width="180" height="7" rx="3.5" fill="#7FB3B8" fill-opacity="0.25"/>
  <rect x="546" y="280" width="160" height="7" rx="3.5" fill="#7FB3B8" fill-opacity="0.25"/>
  <rect x="546" y="298" width="170" height="7" rx="3.5" fill="#7FB3B8" fill-opacity="0.25"/>
  <text x="546" y="336" class="al hot">panel: starts 0.1 s later,</text>
  <text x="546" y="353" class="al hot">fades in and rises 8 points</text>
  <text x="645" y="426" class="st" text-anchor="middle">Open</text>
  <text x="645" y="444" class="sd" text-anchor="middle">same shell: 320 wide, corners 22 → 26, icons column → row</text>

  <path d="M418,220 L514,220" stroke="#7FB3B8" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <text x="466" y="212" class="al" text-anchor="middle">click</text>
  <path d="M520,380 C420,470 160,440 114,318" stroke="#7FB3B8" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)"/>
  <text x="300" y="470" class="al" text-anchor="middle">open icon again · Esc · click in the page</text>
  <path d="M592,160 C620,118 680,118 690,150" stroke="#7FB3B8" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  <text x="700" y="126" class="al">other icon switches player</text>

  <!-- spring chart -->
  <g transform="translate(850,190)">
    <rect x="-20" y="-40" width="344" height="200" rx="14" fill="#0A0F14" stroke="#2E6F73"/>
    <text x="0" y="-16" class="st">One spring for every part</text>
    <line x1="0" y1="100" x2="300" y2="100" stroke="#3B4A52"/>
    <line x1="0" y1="0" x2="300" y2="0" stroke="#3B4A52" stroke-dasharray="2 4"/>
    <path d="M0.0,100.0 L3.7,99.3 L7.5,97.2 L11.2,94.2 L15.0,90.4 L18.8,86.0 L22.5,81.2 L26.3,76.2 L30.0,71.0 L33.8,65.7 L37.5,60.5 L41.2,55.4 L45.0,50.5 L48.8,45.8 L52.5,41.2 L56.2,37.0 L60.0,33.0 L63.8,29.3 L67.5,25.8 L71.2,22.7 L75.0,19.8 L78.7,17.1 L82.5,14.7 L86.2,12.6 L90.0,10.6 L93.8,8.9 L97.5,7.4 L101.2,6.0 L105.0,4.8 L108.7,3.8 L112.5,2.9 L116.2,2.1 L120.0,1.5 L123.8,0.9 L127.5,0.5 L131.2,0.1 L135.0,-0.2 L138.8,-0.5 L142.5,-0.7 L146.2,-0.8 L150.0,-1.0 L153.8,-1.0 L157.5,-1.1 L161.2,-1.1 L165.0,-1.1 L168.8,-1.1 L172.5,-1.1 L176.2,-1.0 L180.0,-1.0 L183.7,-0.9 L187.5,-0.9 L191.2,-0.8 L195.0,-0.8 L198.8,-0.7 L202.5,-0.7 L206.2,-0.6 L210.0,-0.5 L213.8,-0.5 L217.5,-0.4 L221.2,-0.4 L225.0,-0.4 L228.8,-0.3 L232.5,-0.3 L236.2,-0.2 L240.0,-0.2 L243.8,-0.2 L247.5,-0.2 L251.2,-0.1 L255.0,-0.1 L258.8,-0.1 L262.5,-0.1 L266.2,-0.1 L270.0,-0.0 L273.8,-0.0 L277.5,-0.0 L281.2,-0.0 L285.0,-0.0 L288.8,-0.0 L292.5,-0.0 L296.2,0.0 L300.0,0.0" fill="none" stroke="#EADCC8" stroke-width="2.2"/>
    <path d="M0.0,100.0 L3.7,100.0 L7.5,100.0 L11.2,100.0 L15.0,100.0 L18.8,100.0 L22.5,100.0 L26.3,100.0 L30.0,100.0 L33.8,100.0 L37.5,100.0 L41.2,99.3 L45.0,97.2 L48.8,94.2 L52.5,90.4 L56.2,86.0 L60.0,81.2 L63.8,76.2 L67.5,71.0 L71.2,65.7 L75.0,60.5 L78.7,55.4 L82.5,50.5 L86.2,45.8 L90.0,41.2 L93.8,37.0 L97.5,33.0 L101.2,29.3 L105.0,25.8 L108.7,22.7 L112.5,19.8 L116.2,17.1 L120.0,14.7 L123.8,12.6 L127.5,10.6 L131.2,8.9 L135.0,7.4 L138.8,6.0 L142.5,4.8 L146.2,3.8 L150.0,2.9 L153.8,2.1 L157.5,1.5 L161.2,0.9 L165.0,0.5 L168.8,0.1 L172.5,-0.2 L176.2,-0.5 L180.0,-0.7 L183.7,-0.8 L187.5,-1.0 L191.2,-1.0 L195.0,-1.1 L198.8,-1.1 L202.5,-1.1 L206.2,-1.1 L210.0,-1.1 L213.8,-1.0 L217.5,-1.0 L221.2,-0.9 L225.0,-0.9 L228.8,-0.8 L232.5,-0.8 L236.2,-0.7 L240.0,-0.7 L243.8,-0.6 L247.5,-0.5 L251.2,-0.5 L255.0,-0.4 L258.8,-0.4 L262.5,-0.4 L266.2,-0.3 L270.0,-0.3 L273.8,-0.2 L277.5,-0.2 L281.2,-0.2 L285.0,-0.2 L288.8,-0.1 L292.5,-0.1 L296.2,-0.1 L300.0,-0.1" fill="none" stroke="#C2302F" stroke-width="2.2"/>
    <line x1="37.5" y1="100" x2="37.5" y2="106" stroke="#8FA3A8"/>
    <text x="0" y="120" class="ax">0</text>
    <text x="37.5" y="120" class="ax" text-anchor="middle">0.1 s</text>
    <text x="300" y="120" class="ax" text-anchor="end">time →</text>
    <text x="0" y="142" class="mono" font-size="11">spring(response: 0.5, dampingFraction: 0.82)</text>
    <rect x="186" y="22" width="12" height="3" fill="#EADCC8"/><text x="204" y="27" class="ax">shell, icons, labels</text>
    <rect x="186" y="40" width="12" height="3" fill="#C2302F"/><text x="204" y="45" class="ax">panel content</text>
  </g>
  <text x="830" y="390" class="sd">Overshoot is about 1%, so the glass lands without a wobble.</text>
  <text x="830" y="408" class="sd">Reduce Motion: pill and card cross-fade instead.</text>

  <line x1="40" y1="500" x2="1160" y2="500" stroke="#2E6F73" stroke-opacity="0.5"/>

  <!-- ===== 2. roll-up panel ===== -->
  <text x="40" y="540" class="h2">2 · A settings panel rolls up out of its button</text>

  <rect x="80" y="572" width="254" height="74" rx="16" fill="#1C2A33" stroke="#7FB3B8" stroke-width="1.3"/>
  <rect x="101" y="598" width="165" height="48" rx="11" fill="#1C2A33" fill-opacity="0.7" stroke="#7FB3B8" stroke-opacity="0.7" stroke-dasharray="4 3"/>
  <rect x="122" y="624" width="76" height="22" rx="5" fill="#1C2A33" fill-opacity="0.5" stroke="#7FB3B8" stroke-opacity="0.5" stroke-dasharray="3 3"/>
  <text x="96" y="592" class="ax">Aa</text>
  <rect x="120" y="587" width="140" height="3" rx="1.5" fill="#5B6268"/>
  <circle cx="200" cy="588.5" r="6.5" fill="#E6E6E6"/>
  <text x="304" y="594" class="st">Aa</text>
  <circle cx="140" cy="646" r="5" fill="#C2302F"/>
  <rect x="100" y="656" width="240" height="28" rx="14" fill="#24282C" stroke="#4A5157"/>
  <rect x="103" y="659" width="74" height="22" rx="11" fill="#4A5157"/>
  <text x="140" y="674" class="ui" text-anchor="middle">Size</text>
  <text x="206" y="674" class="ui" text-anchor="middle">Font</text>
  <text x="290" y="674" class="ui" text-anchor="middle">Lock Screen</text>
  <text x="120" y="708" class="al hot">anchor: the button's centre on the panel's lower edge</text>

  <text x="420" y="585" class="sd">Opens: scales 0.3 → 1 and fades in, pinned to its button, so it reads as coming out of it.</text>
  <text x="420" y="607" class="mono">spring(response: 0.3, dampingFraction: 0.84)</text>
  <text x="420" y="629" class="sd">Shorter than the pill: a panel is a quick tool and should never hold up the next click.</text>
  <text x="420" y="651" class="sd">Closes in reverse: second click, another button, a click anywhere in the page, or Esc.</text>
  <text x="420" y="673" class="sd">The Settings panel under the gear: scales 0.94 → 1 from its top-right corner, same spring.</text>
  <text x="420" y="695" class="sd">Reduce Motion: a 0.2 s fade in place.</text>

  <line x1="40" y1="730" x2="1160" y2="730" stroke="#2E6F73" stroke-opacity="0.5"/>

  <!-- ===== 3. presence ===== -->
  <text x="40" y="770" class="h2">3 · Lyrics give way to silence</text>

  <g transform="translate(80,800)">
    <line x1="0" y1="120" x2="480" y2="120" stroke="#3B4A52"/>
    <line x1="0" y1="0" x2="480" y2="0" stroke="#3B4A52" stroke-dasharray="2 4"/>
    <line x1="0" y1="54" x2="480" y2="54" stroke="#3B4A52" stroke-dasharray="2 4"/>
    <path d="M0.0,0.0 L3.0,0.0 L6.0,0.0 L9.0,0.0 L12.0,0.0 L15.0,0.0 L18.0,0.0 L21.0,0.0 L24.0,0.0 L27.0,0.0 L30.0,0.0 L33.0,0.0 L36.0,0.0 L39.0,0.0 L42.0,0.0 L45.0,0.0 L48.0,0.0 L51.0,0.0 L54.0,0.0 L57.0,0.0 L60.0,0.0 L63.0,0.0 L66.0,0.0 L69.0,0.0 L72.0,0.0 L75.0,0.0 L78.0,0.0 L81.0,0.0 L84.0,0.0 L87.0,0.0 L90.0,0.0 L93.0,0.0 L96.0,0.0 L99.0,0.0 L102.0,0.0 L105.0,0.0 L108.0,0.0 L111.0,0.0 L114.0,0.0 L117.0,0.0 L120.0,0.0 L123.0,0.0 L126.0,0.0 L129.0,0.0 L132.0,0.0 L135.0,0.0 L138.0,0.0 L141.0,0.0 L144.0,0.0 L147.0,0.0 L150.0,0.0 L153.0,0.0 L156.0,0.0 L159.0,0.0 L162.0,0.0 L165.0,0.0 L168.0,0.0 L171.0,0.0 L174.0,0.0 L177.0,0.0 L180.0,0.0 L183.0,0.4 L186.0,1.5 L189.0,3.3 L192.0,5.6 L195.0,8.4 L198.0,11.7 L201.0,15.2 L204.0,19.0 L207.0,23.0 L210.0,27.0 L213.0,31.0 L216.0,35.0 L219.0,38.8 L222.0,42.3 L225.0,45.6 L228.0,48.4 L231.0,50.7 L234.0,52.5 L237.0,53.6 L240.0,54.0 L243.0,54.0 L246.0,54.0 L249.0,54.0 L252.0,54.0 L255.0,54.0 L258.0,54.0 L261.0,54.0 L264.0,54.0 L267.0,54.0 L270.0,54.0 L273.0,54.0 L276.0,54.0 L279.0,54.0 L282.0,54.0 L285.0,54.0 L288.0,54.0 L291.0,54.0 L294.0,54.0 L297.0,54.0 L300.0,54.0 L303.0,54.0 L306.0,54.0 L309.0,54.0 L312.0,54.0 L315.0,54.0 L318.0,54.0 L321.0,54.0 L324.0,54.0 L327.0,54.0 L330.0,54.0 L333.0,54.0 L336.0,54.0 L339.0,54.0 L342.0,54.0 L345.0,54.0 L348.0,54.0 L351.0,54.0 L354.0,54.0 L357.0,54.0 L360.0,54.0 L363.0,54.0 L366.0,54.0 L369.0,51.7 L372.0,45.6 L375.0,36.9 L378.0,27.0 L381.0,17.1 L384.0,8.4 L387.0,2.3 L390.0,0.0 L393.0,0.0 L396.0,0.0 L399.0,0.0 L402.0,0.0 L405.0,0.0 L408.0,0.0 L411.0,0.0 L414.0,0.0 L417.0,0.0 L420.0,0.0 L423.0,0.0 L426.0,0.0 L429.0,0.0 L432.0,0.0 L435.0,0.0 L438.0,0.0 L441.0,0.0 L444.0,0.0 L447.0,0.0 L450.0,0.0 L453.0,0.0 L456.0,0.0 L459.0,0.0 L462.0,0.0 L465.0,0.0 L468.0,0.0 L471.0,0.0 L474.0,0.0 L477.0,0.0 L480.0,0.0" fill="none" stroke="#EADCC8" stroke-width="2.4"/>
    <g stroke="#7FB3B8" stroke-opacity="0.6" stroke-dasharray="3 3">
      <line x1="30" y1="-6" x2="30" y2="120"/><line x1="180" y1="-6" x2="180" y2="120"/>
      <line x1="240" y1="54" x2="240" y2="120"/><line x1="390" y1="-6" x2="390" y2="120"/><line x1="450" y1="-6" x2="450" y2="120"/>
    </g>
    <text x="-8" y="4" class="ax" text-anchor="end">100%</text>
    <text x="-8" y="58" class="ax" text-anchor="end">55%</text>
    <text x="30" y="136" class="ax" text-anchor="middle">last word</text>
    <text x="180" y="136" class="ax" text-anchor="middle">+5 s</text>
    <text x="240" y="136" class="ax" text-anchor="middle">+7 s</text>
    <text x="390" y="136" class="ax" text-anchor="middle">−2 s</text>
    <text x="450" y="136" class="ax" text-anchor="middle">next line</text>
  </g>
  <text x="80" y="958" class="sd">Departure Board, Receipt, Messages, Money and Notifications stay up and step back.</text>

  <g transform="translate(720,800)">
